name: ULTRON CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Architecture, Security & Regression Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sistem/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Master Architecture Test Suite
        env:
          PYTHONUTF8: "1"
          ULTRON_PUBLIC: "0"
        run: |
          python -X utf8 sistem/tests/run_all_tests.py

      - name: Run Pytest Test Suite
        env:
          PYTHONUTF8: "1"
          ULTRON_PUBLIC: "0"
        run: |
          pytest sistem/tests
