# ULTRON Heartbeat Configuration
# Bu dosya daemon_manager.py tarafından okunur.
# Hangi servislerin ne sıklıkla çalışacağını tanımlar.

daemons:
  proactive_watcher:
    enabled: true
    description: "Ekran ve hata gözlemcisi"

  cyber_dog:
    enabled: true
    description: "Güvenlik tarama daemon'u"
    patrol_interval_sec: 30

  workspace_agent:
    enabled: true
    description: "Google Workspace (Gmail/Takvim) izleyici"
    check_interval_sec: 300  # 5 dakika

  observer_daemon:
    enabled: true
    description: "Webcam varlık ve ruh hali analizi"
    patrol_interval_sec: 30
    mood_analysis_interval_sec: 120

  dream_engine:
    enabled: true
    description: "Gece bellek konsolidasyonu"
    check_interval_sec: 300
    night_hours: [2, 4]           # Gece 02:00-04:00 arası tetiklenir
    inactivity_threshold_min: 30  # 30 dk hareketsizlikte tetiklenir

  semantic_desktop:
    enabled: true
    description: "Ekran belleği ve OCR"
    capture_interval_sec: 300     # 5 dakikada bir
    retention_days: 7             # 7 günden eski kayıtlar silinir

  desktop_hud:
    enabled: true
    description: "Şeffaf masaüstü komut arayüzü"
    hotkey: "alt+space"

# ── Otonom Zamanlı Görevler (OpenClaw Heartbeat Cron) ──────────────────────
# Ajan bu görevleri kullanıcı mesajı beklemeden, belirtilen saatte kendi kendine yapar.
# cron formatı: "HH:MM" veya "*/N" (her N dakikada bir)
scheduled_tasks:
  - name: "Sabah Özeti"
    description: "Hava durumu, takvim ve önemli haberleri kontrol et ve YARATICI'ya sabah özeti sun."
    cron: "08:00"
    enabled: true
    channel: "broadcast"   # Bağlı tüm istemcilere gönder

  - name: "Öğle Hatırlatıcısı"
    description: "Aktif hatırlatıcıları ve takvim etkinliklerini kontrol et, öğle zamanı uyar."
    cron: "12:00"
    enabled: true
    channel: "broadcast"

  - name: "Akşam Bellek Konsolidasyonu"
    description: "Günün conversation özeti çıkar, hafızayı güncelle, soul.md'e içgörü ekle."
    cron: "23:00"
    enabled: true
    channel: "silent"      # Sessiz mod — sadece hafızaya yaz, ses/mesaj üretme

  - name: "Sistem Sağlık Kontrolü"
    description: "Disk kullanımı, CPU yükü ve aktif daemon'ları kontrol et. Sorun varsa uyar."
    cron: "*/60"           # Her 60 dakikada bir
    enabled: true
    channel: "silent"

# Sistem geneli ayarlar
settings:
  max_parallel_agents: 4
  tool_timeout_sec: 60
  memory_max_entries: 500
  log_level: "INFO"
